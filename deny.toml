# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Every dependency must be compatible with CeriumMC's GPL-2.0-only license.
# Apache-2.0 on its own is NOT compatible with GPL-2.0 (crates dual-licensed
# "MIT OR Apache-2.0" are fine through MIT). GPL-3.0 and LGPL-3.0 are not
# compatible either. The LLVM exception makes Apache-2.0 GPL-2.0-compatible.
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "ISC",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
