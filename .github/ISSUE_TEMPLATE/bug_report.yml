name: Bug report
description: CeriumMC behaves differently from vanilla, crashes, or misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For **security issues**, do not open an issue; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did CeriumMC do?
    validations:
      required: true
  - type: textarea
    id: vanilla
    attributes:
      label: What does vanilla 26.3 do?
      description: The expected behaviour on the official server, if you know it.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with ...
        2. Join and ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: CeriumMC commit / version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Windows
        - ARM (Raspberry Pi / ARM server)
        - Android
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
