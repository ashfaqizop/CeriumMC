name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (fmt, clippy, docs, lockfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo.lock is up to date
        run: |
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            cargo generate-lockfile
            echo "::error::Cargo.lock is out of date. The expected lockfile is:"
            cat Cargo.lock
            exit 1
          fi
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc
        if: ${{ !cancelled() }}
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-2025 }
          - { name: macos-aarch64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustup if missing
        if: runner.os != 'Windows'
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: Startup baseline
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /usr/bin/time ]; then
            sudo apt-get update -q && sudo apt-get install -yq time
          fi
          for run in 1 2 3 4 5; do
            /usr/bin/time -f '%e %M' -a -o startup.txt \
              target/release/ceriummc --version > /dev/null
          done
          {
            echo "### \`ceriummc --version\` startup (${{ matrix.name }})"
            echo
            echo "| run | wall time (s) | peak RSS (KiB) |"
            echo "|---|---|---|"
            awk '{ printf "| %d | %s | %s |\n", NR, $1, $2 }' startup.txt
          } >> "$GITHUB_STEP_SUMMARY"

  cross:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: armv7-unknown-linux-gnueabihf, run-tests: true }
          - { target: aarch64-linux-android, run-tests: false }
          - { target: armv7-linux-androideabi, run-tests: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain and target
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Set up ARMv7 cross linker and QEMU
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            qemu-user-static binfmt-support
          {
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc"
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER=qemu-arm-static"
            echo "QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf"
          } >> "$GITHUB_ENV"
      - name: Set up Android NDK linker
        if: contains(matrix.target, 'android')
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              var=CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
              clang=aarch64-linux-android24-clang ;;
            armv7-linux-androideabi)
              var=CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
              clang=armv7a-linux-androideabi24-clang ;;
          esac
          test -x "$bin/$clang"
          echo "$var=$bin/$clang" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --workspace --all-targets --locked --target ${{ matrix.target }}
      - name: Test (under QEMU)
        if: matrix.run-tests
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Release build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"

  vanilla:
    name: Vanilla reference server
    # Running the official server requires accepting the Minecraft EULA
    # (https://aka.ms/MinecraftEULA). The maintainer opts in by setting the repository
    # variable ACCEPT_MINECRAFT_EULA=true; without it this job is skipped.
    if: vars.ACCEPT_MINECRAFT_EULA == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the vanilla pin
        run: grep -v '^#' ci/vanilla.env >> "$GITHUB_ENV"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.1" # the exact JDK Mojang ships for 26.3 (java-runtime-epsilon)
      - name: Restore the vanilla server jar
        id: jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vanilla/server.jar
          key: vanilla-server-${{ hashFiles('ci/vanilla.env') }}
      - name: Download the vanilla server jar from Mojang
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p .vanilla
          curl -fsSL --retry 3 "$VANILLA_SERVER_URL" -o .vanilla/server.jar
      - name: Verify the jar (SHA-1 and size)
        run: |
          echo "$VANILLA_SERVER_SHA1  .vanilla/server.jar" | sha1sum --check --strict
          test "$(stat -c %s .vanilla/server.jar)" = "$VANILLA_SERVER_SIZE"
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the probe
        run: cargo build --release --locked -p cerium-probe
      - name: Prepare the server directory
        run: |
          mkdir -p .vanilla/run
          cp ci/vanilla-server.properties .vanilla/run/server.properties
          # Accepted by the maintainer through ACCEPT_MINECRAFT_EULA (see the job comment).
          echo "eula=true" > .vanilla/run/eula.txt
      - name: Boot vanilla on a fresh world
        run: ci/boot-vanilla.sh fresh-world
      - name: Boot vanilla on the existing world
        run: ci/boot-vanilla.sh existing-world
      - name: Record golden cases from vanilla
        run: ci/golden-record.sh
      - name: Golden tests (linux-x86_64)
        run: cargo test --workspace --locked --no-fail-fast
        env:
          CERIUM_GOLDEN_DIR: ${{ github.workspace }}/.vanilla/golden
          CERIUM_REQUIRE_GOLDEN: "1"
      - name: Share golden cases with the cross-platform job (cache only, never an artifact)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vanilla/golden
          key: golden-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
      - name: Report
        if: ${{ !cancelled() }}
        run: ci/boot-summary.sh boot-*.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload boot reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-reports-vanilla
          path: boot-*.json
          if-no-files-found: ignore

  golden-cross:
    name: Golden (${{ matrix.name }})
    # Replays vanilla's golden cases on other platforms: results must be bit-identical
    # everywhere, including 32-bit ARM.
    needs: vanilla
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: "" }
          - { name: windows-x86_64, os: windows-2025, target: "" }
          - { name: macos-aarch64, os: macos-15, target: "" }
          - { name: armv7-qemu, os: ubuntu-24.04, target: armv7-unknown-linux-gnueabihf }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustup if missing
        if: runner.os != 'Windows'
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show
      - name: Set up ARMv7 cross linker and QEMU
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          sudo apt-get update -q
          sudo apt-get install -yq gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            qemu-user-static binfmt-support
          {
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc"
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER=qemu-arm-static"
            echo "QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf"
            echo "CARGO_BUILD_TARGET=armv7-unknown-linux-gnueabihf"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: golden-${{ matrix.name }}
      - name: Restore golden cases
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vanilla/golden
          key: golden-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Golden tests
        run: cargo test --workspace --locked --no-fail-fast
        env:
          CERIUM_GOLDEN_DIR: ${{ github.workspace }}/.vanilla/golden
          CERIUM_REQUIRE_GOLDEN: "1"

  hotspot-math:
    name: HotSpot math fingerprint (${{ matrix.name }})
    # Records java.lang.Math on the JDK Mojang ships (25.0.1) and prints a digest per function,
    # so results can be compared across CPUs (Intel vs AMD vs ARM). JDK-only; no Minecraft code.
    # On x86_64 it then replays the recording against cerium_math::hotspot with this CPU's
    # vendor, so the Intel and AMD RCPPS tables are both checked on real hardware (the Intel
    # macOS runner always has an Intel CPU; the others are usually AMD EPYC).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64-1, os: ubuntu-24.04, replay: true }
          - { name: linux-x86_64-2, os: ubuntu-22.04, replay: true }
          - { name: linux-x86_64-3, os: ubuntu-24.04, replay: true }
          - { name: windows-x86_64, os: windows-2025, replay: true }
          - { name: macos-x86_64-intel, os: macos-15-intel, replay: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, replay: false }
          - { name: macos-aarch64, os: macos-15, replay: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.1"
      - name: Record and fingerprint
        run: |
          case "$RUNNER_OS" in
            Linux) cpu="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- || true)"
                   [ -n "$cpu" ] || cpu="$(lscpu | grep -m1 'Model name' | cut -d: -f2-)" ;;
            macOS) cpu="$(sysctl -n machdep.cpu.brand_string)" ;;
            Windows) cpu="$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name')" ;;
          esac
          echo "CPU: $cpu"
          javac -d jmath-classes parity/golden/JMathMain.java
          java -cp jmath-classes golden.JMathMain jmath-out | tee fingerprint.txt
          ci/cpu-vendor.sh > jmath-out/cpu-vendor.txt
          echo "CPU vendor: $(cat jmath-out/cpu-vendor.txt)"
          grep '^jm.pow ' jmath-out/jmath.txt | gzip -9 > jmath-pow.txt.gz
          {
            echo "### HotSpot math fingerprint (${{ matrix.name }})"
            echo
            echo "CPU: \`$(echo $cpu)\`"
            echo
            echo '```'
            cat fingerprint.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned toolchain
        if: matrix.replay
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.replay
        with:
          key: hotspot-${{ matrix.name }}
      - name: Replay against cerium_math::hotspot
        if: matrix.replay
        run: cargo test --locked -p cerium-math --test hotspot -- --nocapture
        env:
          CERIUM_GOLDEN_DIR: ${{ github.workspace }}/jmath-out
          CERIUM_REQUIRE_GOLDEN: "1"
      - name: Upload pow results (JDK-only data, for cross-CPU comparison)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmath-pow-${{ matrix.name }}
          path: jmath-pow.txt.gz
          retention-days: 3

  rcpps:
    name: Measure RCPPS (${{ matrix.name }})
    # Runs RCPPS over all 2^23 inputs used by HotSpot's log/pow stubs and uploads the exact table.
    # Linux and Windows runner CPUs are usually AMD EPYC; the Intel macOS runner always has an
    # Intel CPU, so both vendors are measured on every run.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-1, os: ubuntu-24.04 }
          - { name: x86_64-2, os: ubuntu-24.04 }
          - { name: x86_64-3, os: ubuntu-22.04 }
          - { name: x86_64-4, os: ubuntu-22.04 }
          - { name: x86_64-5, os: windows-2025 }
          - { name: x86_64-intel-macos, os: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Measure
        run: |
          cargo run --release --locked -p cerium-rcp -- rcp.rs | tee rcp-summary.txt
          { echo '### RCPPS (${{ matrix.name }})'; echo '```'; cat rcp-summary.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rcp-${{ matrix.name }}
          path: |
            rcp.rs
            rcp-summary.txt
          retention-days: 7
