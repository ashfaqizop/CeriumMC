[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-only"
repository = "https://github.com/ashfaqizop/CeriumMC"
authors = ["StepByte Studios"]
publish = false

[workspace.dependencies]
cerium-brigadier = { path = "crates/cerium-brigadier" }
cerium-golden = { path = "tools/cerium-golden" }
cerium-java = { path = "crates/cerium-java" }
cerium-math = { path = "crates/cerium-math" }
cerium-random = { path = "crates/cerium-random" }
cerium-util = { path = "crates/cerium-util" }
cerium-version = { path = "crates/cerium-version" }
libm = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
